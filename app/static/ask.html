<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問問題 — PersonalDocAI</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-brand">PersonalDocAI</h1>
  <div class="site-header-right">
    <nav class="site-nav" aria-label="主要導覽">
      <a href="/ui/upload.html">上傳照片</a>
      <a href="/ui/browse.html">瀏覽資料夾</a>
      <a href="/ui/ask.html" aria-current="page">問問題</a>
    </nav>
    <!-- AI 後端開關（2026-08-22）：與上傳頁是同一顆開關（同一個伺服器狀態）——
         撥到「雲端」＝這一頁的判斷查法與產生回答都改走 Ollama Cloud。
         行為在共用檔 /ui/ai_switch.js。 -->
    <div class="ai-switch">
      <span id="ai-switch-label" class="ai-switch-label">AI 模型</span>
      <button type="button" id="ai-toggle" class="ai-toggle" role="switch"
              aria-checked="false" aria-labelledby="ai-switch-label"
              title="切換 AI 走本機 Ollama 或 Ollama Cloud（看圖與問答都跟著）">
        <span class="ai-side" data-side="local">本機</span>
        <span class="ai-side" data-side="cloud">雲端</span>
      </button>
      <span id="ai-switch-msg" class="ai-switch-msg" aria-live="polite"></span>
    </div>
  </div>
</header>

<main class="page">

<h2>問問題（中文或英文都可以）</h2>
<p class="lead">
  例如：「有哪些在 Target 拍的收據？」、「我最近買過什麼飲料？」、
  "What drinks did I buy recently?"　——回答的語言會跟著你提問的語言。
</p>

<form id="ask-form" class="field-row">
  <input type="text" id="question-input" class="field" placeholder="輸入你的問題…" required>
  <button type="submit" id="submit-button" class="btn btn-primary">送出</button>
</form>

<section class="panel" id="result" aria-live="polite">
  <p class="panel-empty">尚未提問。</p>
</section>

</main>

<script src="/ui/ai_switch.js"></script>

<script>
const form = document.getElementById("ask-form");
const questionInput = document.getElementById("question-input");
const button = document.getElementById("submit-button");
const result = document.getElementById("result");

// 把使用者／AI 產生的文字安全地放進 HTML。
// 不做這件事的話，回答裡的一個 "<" 就會把版面弄壞，
// 更糟的情況是其中夾帶的內容被瀏覽器當成程式碼執行（XSS）。
function esc(value) {
  const 文字 = (value === null || value === undefined || value === "") ? "（無）" : value;
  return String(文字)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// 把回答畫成一張卡片：回答是主角（大一級字），檢索資訊用兩欄小字
function renderAnswer(body) {
  const ids = (body.retrieved_photo_ids.length > 0)
    ? body.retrieved_photo_ids.map(function (id) { return "#" + id; }).join(" ")
    : "（沒有找到相關照片）";
  result.innerHTML =
    '<p class="answer">' + esc(body.answer) + '</p>' +
    '<dl class="kv">' +
      '<dt>檢索方式</dt><dd class="mono">' + esc(body.search_mode) + '</dd>' +
      '<dt>依據照片</dt><dd class="mono">' + esc(ids) + '</dd>' +
    '</dl>';
}

// 還沒輸入問題 / 思考中：一行提示就夠
function renderNotice(message) {
  result.innerHTML = '<p class="panel-empty">' + esc(message) + '</p>';
}

// HTTP 錯誤 / 連不上伺服器。label 是狀態列那行字，detail 是底下的細節。
function renderError(label, detail) {
  const 說明 = (typeof detail === "string") ? detail : JSON.stringify(detail);
  result.innerHTML =
    '<p class="status status-error">' + esc(label) + '</p>' +
    '<p>' + esc(說明) + '</p>';
}

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  const question = questionInput.value.trim();
  if (question === "") {
    renderNotice("請先輸入問題。");
    return;
  }

  button.disabled = true;
  // 等待提示跟著頁首的開關走。aiBackendNow() 來自共用檔 /ui/ai_switch.js
  renderNotice(aiBackendNow() === "cloud"
    ? "思考中…（AI 走 Ollama Cloud 判斷查法並產生回答）"
    : "思考中…（本機模型要判斷查法再產生回答，可能要等一下）");

  try {
    const response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question })
    });
    const body = await response.json();

    if (response.status === 200) {
      renderAnswer(body);
    } else {
      renderError("失敗（HTTP " + response.status + "）", body.detail);
    }
  } catch (error) {
    renderError("請求失敗", error + "。最常見原因：uvicorn 沒在跑，或網址、埠號不對。");
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>

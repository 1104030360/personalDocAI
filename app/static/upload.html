<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上傳照片 — PersonalDocAI</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-brand">PersonalDocAI</h1>
  <nav class="site-nav" aria-label="主要導覽">
    <a href="/ui/upload.html" aria-current="page">上傳照片</a>
    <a href="/ui/browse.html">瀏覽資料夾</a>
    <a href="/ui/ask.html">問問題</a>
  </nav>
</header>

<main class="page">

<h2>上傳照片</h2>
<p class="lead">選一張 JPEG／PNG，或一份 PDF（一頁會存成一張照片）。AI 會看圖並存成文字描述＋四個欄位，
接著在彈出的視窗裡決定要收進哪個資料夾——選定就定案，或按「稍後再說」先放進待決定區。</p>

<form id="upload-form" class="field-row">
  <input type="file" id="file-input" class="field" accept="image/jpeg,image/png,application/pdf" required>
  <button type="submit" id="submit-button" class="btn btn-primary">上傳</button>
</form>

<section class="panel" id="result" aria-live="polite">
  <p class="panel-empty">尚未上傳任何照片。</p>
</section>

</main>

<script src="/ui/folder_modal.js"></script>
<script src="/ui/entity_modal.js"></script>
<script src="/ui/task_modal.js"></script>

<script>
// ===== 上傳頁自己的程式（這段不會搬走）=====
const form = document.getElementById("upload-form");
const fileInput = document.getElementById("file-input");
const button = document.getElementById("submit-button");
const result = document.getElementById("result");

// 把使用者／AI 產生的文字安全地放進 HTML。
// 不做這件事的話，照片描述裡的一個 "<" 就會把版面弄壞，
// 更糟的情況是其中夾帶的內容被瀏覽器當成程式碼執行（XSS）。
function esc(value) {
  const 文字 = (value === null || value === undefined || value === "") ? "（無）" : value;
  return String(文字)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// 把上傳結果畫成一張卡片。歸類成功後資料夾名稱會變，所以獨立成一個參數。
// 提醒：資料夾名稱就是 category（design1.md §4），不是兩個東西。
function renderResult(body, folderName, note) {
  const m = body.metadata;
  const items = (m.items && m.items.length > 0) ? m.items.join(" · ") : "";
  result.innerHTML =
    '<p class="status status-ok">已上傳</p>' +
    '<dl class="kv">' +
      '<dt>照片</dt><dd class="mono">#' + esc(body.id) + '</dd>' +
      '<dt>文字描述</dt><dd>' + esc(body.text) + '</dd>' +
      '<dt>資料夾</dt><dd>' + esc(folderName) + '</dd>' +
      '<dt>地點</dt><dd>' + esc(m.location) + '</dd>' +
      '<dt>物品</dt><dd>' + esc(items) + '</dd>' +
      '<dt>內容時間</dt><dd>' + esc(m.content_time) + '</dd>' +
    '</dl>' +
    '<p class="note">' + esc(note) + '</p>';
}

// 還沒選檔案 / 上傳中：一行提示就夠
function renderNotice(message) {
  result.innerHTML = '<p class="panel-empty">' + esc(message) + '</p>';
}

// 415 / 422 / 500 / 連不上伺服器。label 是狀態列那行字，detail 是底下的細節。
function renderError(label, detail) {
  const 說明 = (typeof detail === "string") ? detail : JSON.stringify(detail);
  result.innerHTML =
    '<p class="status status-error">' + esc(label) + '</p>' +
    '<p>' + esc(說明) + '</p>';
}

// 上傳成功後：畫結果卡片，並開彈窗要使用者決定這張照片收進哪個資料夾。
// 前言＝寫在說明最前面的補充，PDF 用它交代整份的入庫結果；單圖傳空字串。
// 彈窗鏈（design3.md §2、§2.1）：抽屜 → 實體——順序固定，
// 而且抽屜按「稍後再說」鏈**仍然繼續**走到實體窗（照片留在待決定不影響釘實體）。
function 開始歸類(photo, 前言) {
  // design2.md D6：AI 建議被 clamp 成「未分類」＝不確定 → 不顯示①，交給「稍後再說」
  const 建議可用 = photo.suggested_folder.id !== photo.folder.id;
  renderResult(
    photo,
    "未分類（待決定）",
    前言 + (建議可用
      ? "AI 建議放進「" + photo.suggested_folder.name + "」，請在彈出的視窗裡決定。"
      : "AI 不確定這張要放哪，請在視窗裡選一個資料夾，或稍後再說。")
  );
  openFolderModal({
    photoId: photo.id,
    // design2.md D7：下拉選單排除收件箱——定案目標必須是真資料夾
    folders: photo.folders.filter(function (f) { return f.id !== photo.folder.id; }),
    primary: 建議可用 ? photo.suggested_folder : null,
    primaryVerb: "採用",
    onAssigned: function (folder) {
      接著釘實體(photo, 前言, folder.name, "✅ 已歸到「" + folder.name + "」。");
    },
    onClosed: function () {
      接著釘實體(
        photo,
        前言,
        "未分類（待決定）",
        "已放進待決定區，之後到瀏覽頁的「待決定」分頁完成歸類。"
      );
    }
  });
}

// 彈窗 2【實體】：抽屜窗結束（不論定案或稍後再說）就接著開。
// 資料夾結果先寫上卡片，實體的成果等使用者按④再補上去——卡片永遠反映目前進度。
function 接著釘實體(photo, 前言, 資料夾名稱, 資料夾結果) {
  renderResult(photo, 資料夾名稱, 前言 + 資料夾結果 + "接著決定要不要釘上實體——");
  openEntityModal({
    photoId: photo.id,
    entities: photo.entities,            // 上傳回應帶的完整實體清單（②下拉）
    suggested: photo.suggested_entity,   // clamp 過的建議；null＝①不顯示
    onDone: function (pinned) {
      const 實體結果 = pinned.length > 0
        ? "已釘上 " + pinned.length + " 個實體：" +
          pinned.map(function (e) { return e.name; }).join("、") + "。"
        : "未釘實體。";
      接著確認待辦(photo, 前言 + 資料夾結果 + 實體結果, 資料夾名稱);
    }
  });
}

// 彈窗 3【待辦】：只有 VLM 判斷有 actionable（suggested_task 有標題）才出現——
// 「空關不跳」（design3.md §2.1）；建立／略過之後整條鏈才算收工。
function 接著確認待辦(photo, 前文, 資料夾名稱) {
  const 建議 = photo.suggested_task;
  if (!建議 || !建議.title) {
    renderResult(photo, 資料夾名稱, 前文);   // 沒有待辦建議：鏈到實體就結束
    return;
  }
  renderResult(photo, 資料夾名稱, 前文 + "最後確認一件待辦——");
  openTaskModal({
    photoId: photo.id,
    suggestion: 建議,
    onDone: function (task) {
      const 待辦結果 = task
        ? "已建立待辦「" + task.title + "」" +
          (task.due_date ? "（到期 " + task.due_date + "）" : "") + "。"
        : "略過待辦。";
      renderResult(photo, 資料夾名稱, 前文 + 待辦結果);
    }
  });
}

// PDF 的 201 回應（design3.md D7）：pages 總頁數、created 每頁一筆、skipped_pages 看不懂的頁。
function pdf摘要(body) {
  const 跳過 = body.skipped_pages.length > 0
    ? "（第 " + body.skipped_pages.join("、") + " 頁看不懂，已跳過）"
    : "";
  return "PDF 共 " + body.pages + " 頁，已入庫 " + body.created.length + " 頁" + 跳過 +
    "；其餘頁留在待決定區，可到瀏覽頁的「待決定」分頁完成歸類。以下先處理第 1 頁——";
}

form.addEventListener("submit", async function (event) {
  event.preventDefault();               // 不要讓瀏覽器用傳統方式送出表單並跳頁

  const file = fileInput.files[0];
  if (!file) {
    renderNotice("請先選一個檔案。");
    return;
  }

  button.disabled = true;
  renderNotice("上傳中…（本機模型看圖可能要等 10〜60 秒，請耐心等候）");

  // FormData 會自動組成 multipart/form-data，欄位名必須是 file
  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch("/photos", { method: "POST", body: formData });
    const body = await response.json();

    if (response.status === 201) {
      // 回應帶 created ＝ 這是 PDF（一頁一張照片）。彈窗只為第一頁開——
      // 其餘頁留在待決定區，免得一份 20 頁的掃描檔逼使用者連按 20 次。
      if (body.created) {
        開始歸類(body.created[0], pdf摘要(body));
      } else {
        開始歸類(body, "");
      }
    } else {
      // 415＝不是 JPEG/PNG/PDF；422＝VLM 看不懂或 PDF 讀不開（什麼都沒存）；其他＝伺服器問題
      renderError("失敗（HTTP " + response.status + "）", body.detail);
    }
  } catch (error) {
    renderError("請求失敗", error + "。最常見原因：uvicorn 沒在跑，或網址、埠號不對。");
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>

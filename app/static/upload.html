<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上傳照片 — PersonalDocAI</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-brand">PersonalDocAI</h1>
  <div class="site-header-right">
    <nav class="site-nav" aria-label="主要導覽">
      <a href="/ui/upload.html" aria-current="page">上傳照片</a>
      <a href="/ui/pending.html">待決定（<span id="nav-pending-count">…</span>）</a>
      <a href="/ui/browse.html">瀏覽資料夾</a>
      <a href="/ui/ask.html">問問題</a>
    </nav>
    <!-- AI 後端開關（2026-08-22）：撥到「雲端」＝看圖與問答都改走 Ollama Cloud。
         狀態存在伺服器（PUT /settings/ai-backend），全站同一個開關狀態
         （相機頁的拍照走同一個 get_vlm，所以也跟著）；
         行為在共用檔 /ui/ai_switch.js（問問題頁放的是同一顆）。 -->
    <div class="ai-switch">
      <span id="ai-switch-label" class="ai-switch-label">AI 模型</span>
      <button type="button" id="ai-toggle" class="ai-toggle" role="switch"
              aria-checked="false" aria-labelledby="ai-switch-label"
              title="切換 AI 走本機 Ollama 或 Ollama Cloud（看圖與問答都跟著）">
        <span class="ai-side" data-side="local">本機</span>
        <span class="ai-side" data-side="cloud">雲端</span>
      </button>
      <span id="ai-switch-msg" class="ai-switch-msg" aria-live="polite"></span>
    </div>
  </div>
</header>
<script>
// 頂欄「待決定（N）」的 N（增量五 Phase 53；design5.md §6.1）。
// 階段甲還沒有 GET /ingest-jobs，所以直接問既有的 GET /folders，
// 取 is_inbox 那一筆的 photo_count——待決定就是收件箱，數字天生一致。
//
// ⚠ 這一段在五個 HTML 檔裡各有一份、逐字相同。
//    階段丙 Phase 67 會由 progress_panel.js 一次接手（連同 2 秒輪詢），
//    屆時把五份一起刪掉。要改就五份一起改，不要只改一份。
//
// 用 IIFE 包起來：裡面的變數不會外流，不會跟各頁自己的 response／folders 撞名。
(function () {
  const 格子 = document.getElementById("nav-pending-count");
  if (!格子) return;                       // 沒有頂欄的頁面（例如手機取景頁）載入也不做事
  fetch("/folders").then(function (response) {
    if (!response.ok) return null;         // 4xx／5xx：維持「…」，不要顯示一個猜的 0
    return response.json();
  }).then(function (folders) {
    if (!folders) return;
    const inbox = folders.find(function (f) { return f.is_inbox; });
    if (inbox) 格子.textContent = String(inbox.photo_count);
  }).catch(function (error) {
    // 服務沒起來：讓它維持「…」。頁面主體自己會顯示錯誤，這裡不要再吵一次。
  });
})();
</script>

<main class="page">

<h2>上傳照片</h2>
<p class="lead">選一張 JPEG／PNG，或一份 PDF（一頁會存成一張照片）。AI 會看圖並存成文字描述＋四個欄位，
接著在彈出的視窗裡決定要收進哪個資料夾——選定就定案，或按「稍後再說」先放進待決定區。</p>

<form id="upload-form" class="field-row">
  <input type="file" id="file-input" class="field" accept="image/jpeg,image/png,application/pdf" required>
  <button type="submit" id="submit-button" class="btn btn-primary">上傳</button>
</form>

<!-- 無線鏡頭（Phase 36）：東西在手上、還沒進電腦時走這條，省掉 AirDrop 那一步 -->
<p class="note">東西還在手上？<a href="/ui/camera-desk.html">用手機拍</a>——
電腦顯示 QR，手機掃了就變成這台電腦的鏡頭，拍完直接入庫。</p>

<section class="panel" id="result" aria-live="polite">
  <p class="panel-empty">尚未上傳任何照片。</p>
</section>

</main>

<script src="/ui/folder_modal.js"></script>
<script src="/ui/entity_modal.js"></script>
<script src="/ui/task_modal.js"></script>
<script src="/ui/classify_chain.js"></script>
<script src="/ui/ai_switch.js"></script>

<script>
// ===== 上傳頁自己的程式（這段不會搬走）=====
const form = document.getElementById("upload-form");
const fileInput = document.getElementById("file-input");
const button = document.getElementById("submit-button");
const result = document.getElementById("result");

// 把使用者／AI 產生的文字安全地放進 HTML。
// 不做這件事的話，照片描述裡的一個 "<" 就會把版面弄壞，
// 更糟的情況是其中夾帶的內容被瀏覽器當成程式碼執行（XSS）。
function esc(value) {
  const 文字 = (value === null || value === undefined || value === "") ? "（無）" : value;
  return String(文字)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// 把上傳結果畫成一張卡片。歸類成功後資料夾名稱會變，所以獨立成一個參數。
// 提醒：資料夾名稱就是 category（design1.md §4），不是兩個東西。
function renderResult(body, folderName, note) {
  const m = body.metadata;
  const items = (m.items && m.items.length > 0) ? m.items.join(" · ") : "";
  result.innerHTML =
    '<p class="status status-ok">已上傳</p>' +
    '<dl class="kv">' +
      '<dt>照片</dt><dd class="mono">#' + esc(body.id) + '</dd>' +
      '<dt>文字描述</dt><dd>' + esc(body.text) + '</dd>' +
      '<dt>資料夾</dt><dd>' + esc(folderName) + '</dd>' +
      '<dt>地點</dt><dd>' + esc(m.location) + '</dd>' +
      '<dt>物品</dt><dd>' + esc(items) + '</dd>' +
      '<dt>內容時間</dt><dd>' + esc(m.content_time) + '</dd>' +
    '</dl>' +
    '<p class="note">' + esc(note) + '</p>';
}

// 還沒選檔案 / 上傳中：一行提示就夠
function renderNotice(message) {
  result.innerHTML = '<p class="panel-empty">' + esc(message) + '</p>';
}

// 415 / 422 / 500 / 連不上伺服器。label 是狀態列那行字，detail 是底下的細節。
function renderError(label, detail) {
  const 說明 = (typeof detail === "string") ? detail : JSON.stringify(detail);
  result.innerHTML =
    '<p class="status status-error">' + esc(label) + '</p>' +
    '<p>' + esc(說明) + '</p>';
}

// 上傳成功後：開三關彈窗鏈（抽屜 → 實體 → 待辦）。
// 鏈的邏輯在共用檔 /ui/classify_chain.js（相機頁走的是同一份）；
// 這一頁只提供「結果卡怎麼畫」與 PDF 的前言。
// 前言＝寫在說明最前面的補充，PDF 用它交代整份的入庫結果；單圖傳空字串。
function 開始歸類(photo, 前言) {
  startClassifyChain({ photo: photo, 前言: 前言, render: renderResult });
}

// PDF 的 201 回應（design3.md D7）：pages 總頁數、created 每頁一筆、skipped_pages 看不懂的頁。
function pdf摘要(body) {
  const 跳過 = body.skipped_pages.length > 0
    ? "（第 " + body.skipped_pages.join("、") + " 頁看不懂，已跳過）"
    : "";
  return "PDF 共 " + body.pages + " 頁，已入庫 " + body.created.length + " 頁" + 跳過 +
    "；其餘頁留在待決定區，可到瀏覽頁的「待決定」分頁完成歸類。以下先處理第 1 頁——";
}

form.addEventListener("submit", async function (event) {
  event.preventDefault();               // 不要讓瀏覽器用傳統方式送出表單並跳頁

  const file = fileInput.files[0];
  if (!file) {
    renderNotice("請先選一個檔案。");
    return;
  }

  button.disabled = true;
  // 等待提示跟著開關走：本機看圖實測要數分鐘（Phase 33 記錄），雲端快得多。
  // aiBackendNow() 來自共用檔 /ui/ai_switch.js
  renderNotice(aiBackendNow() === "cloud"
    ? "上傳中…（AI 看圖走 Ollama Cloud，通常幾秒〜半分鐘）"
    : "上傳中…（本機模型看圖可能要等數分鐘，請耐心等候）");

  // FormData 會自動組成 multipart/form-data，欄位名必須是 file
  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch("/photos", { method: "POST", body: formData });
    const body = await response.json();

    if (response.status === 201) {
      // 回應帶 created ＝ 這是 PDF（一頁一張照片）。彈窗只為第一頁開——
      // 其餘頁留在待決定區，免得一份 20 頁的掃描檔逼使用者連按 20 次。
      if (body.created) {
        開始歸類(body.created[0], pdf摘要(body));
      } else {
        開始歸類(body, "");
      }
    } else {
      // 415＝不是 JPEG/PNG/PDF；422＝VLM 看不懂或 PDF 讀不開（什麼都沒存）；其他＝伺服器問題
      renderError("失敗（HTTP " + response.status + "）", body.detail);
    }
  } catch (error) {
    renderError("請求失敗", error + "。最常見原因：uvicorn 沒在跑，或網址、埠號不對。");
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上傳照片 — PersonalDocAI</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-brand">PersonalDocAI</h1>
  <nav class="site-nav" aria-label="主要導覽">
    <a href="/ui/upload.html" aria-current="page">上傳照片</a>
    <a href="/ui/browse.html">瀏覽資料夾</a>
    <a href="/ui/ask.html">問問題</a>
  </nav>
</header>

<main class="page">

<h2>上傳照片</h2>
<p class="lead">選一張 JPEG 或 PNG。AI 會看圖並存成文字描述＋四個欄位，照片先放進「未分類」，
接著在彈出的視窗裡決定要收進哪個資料夾。</p>

<form id="upload-form" class="field-row">
  <input type="file" id="file-input" class="field" accept="image/jpeg,image/png" required>
  <button type="submit" id="submit-button" class="btn btn-primary">上傳</button>
</form>

<section class="panel" id="result" aria-live="polite">
  <p class="panel-empty">尚未上傳任何照片。</p>
</section>

</main>

<script src="/ui/folder_modal.js"></script>

<script>
// ===== 上傳頁自己的程式（這段不會搬走）=====
const form = document.getElementById("upload-form");
const fileInput = document.getElementById("file-input");
const button = document.getElementById("submit-button");
const result = document.getElementById("result");

// 把使用者／AI 產生的文字安全地放進 HTML。
// 不做這件事的話，照片描述裡的一個 "<" 就會把版面弄壞，
// 更糟的情況是其中夾帶的內容被瀏覽器當成程式碼執行（XSS）。
function esc(value) {
  const 文字 = (value === null || value === undefined || value === "") ? "（無）" : value;
  return String(文字)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// 把上傳結果畫成一張卡片。歸類成功後資料夾名稱會變，所以獨立成一個參數。
// 提醒：資料夾名稱就是 category（design1.md §4），不是兩個東西。
function renderResult(body, folderName, note) {
  const m = body.metadata;
  const items = (m.items && m.items.length > 0) ? m.items.join(" · ") : "";
  result.innerHTML =
    '<p class="status status-ok">已上傳</p>' +
    '<dl class="kv">' +
      '<dt>照片</dt><dd class="mono">#' + esc(body.id) + '</dd>' +
      '<dt>文字描述</dt><dd>' + esc(body.text) + '</dd>' +
      '<dt>資料夾</dt><dd>' + esc(folderName) + '</dd>' +
      '<dt>地點</dt><dd>' + esc(m.location) + '</dd>' +
      '<dt>物品</dt><dd>' + esc(items) + '</dd>' +
      '<dt>內容時間</dt><dd>' + esc(m.content_time) + '</dd>' +
    '</dl>' +
    '<p class="note">' + esc(note) + '</p>';
}

// 還沒選檔案 / 上傳中：一行提示就夠
function renderNotice(message) {
  result.innerHTML = '<p class="panel-empty">' + esc(message) + '</p>';
}

// 415 / 422 / 500 / 連不上伺服器。label 是狀態列那行字，detail 是底下的細節。
function renderError(label, detail) {
  const 說明 = (typeof detail === "string") ? detail : JSON.stringify(detail);
  result.innerHTML =
    '<p class="status status-error">' + esc(label) + '</p>' +
    '<p>' + esc(說明) + '</p>';
}

form.addEventListener("submit", async function (event) {
  event.preventDefault();               // 不要讓瀏覽器用傳統方式送出表單並跳頁

  const file = fileInput.files[0];
  if (!file) {
    renderNotice("請先選一個檔案。");
    return;
  }

  button.disabled = true;
  renderNotice("上傳中…（本機模型看圖可能要等 10〜60 秒，請耐心等候）");

  // FormData 會自動組成 multipart/form-data，欄位名必須是 file
  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch("/photos", { method: "POST", body: formData });
    const body = await response.json();

    if (response.status === 201) {
      renderResult(
        body,
        body.folder.name,
        "AI 建議放進「" + body.suggested_folder.name + "」，請在彈出的視窗裡決定。"
      );
      openFolderModal({
        photoId: body.id,
        folders: body.folders,
        primary: body.suggested_folder,
        primaryVerb: "採用",
        onAssigned: function (folder) {
          renderResult(body, folder.name, "✅ 已歸到「" + folder.name + "」。");
        },
        onClosed: function () {
          renderResult(
            body,
            body.folder.name,
            "已放進「" + body.folder.name + "」，之後可到瀏覽頁再歸類。"
          );
        }
      });
    } else {
      // 415＝不是 JPEG/PNG；422＝VLM 看不懂（什麼都沒存）；其他＝伺服器問題
      renderError("失敗（HTTP " + response.status + "）", body.detail);
    }
  } catch (error) {
    renderError("請求失敗", error + "。最常見原因：uvicorn 沒在跑，或網址、埠號不對。");
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>

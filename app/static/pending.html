    <a href="/ui/browse.html">瀏覽資料夾</a>
    <a href="/ui/ask.html">問問題</a>

<main class="page">

<h2>待決定</h2>
<p class="lead">還沒歸類的照片都在這裡。點一張，在彈出的視窗裡決定要收進哪個資料夾——
歸進去就定案，之後不能再改。</p>

<div id="view"><p class="message">載入中…</p></div>

</main>

<script src="/ui/folder_modal.js"></script>
<script src="/ui/entity_modal.js"></script>
<script src="/ui/task_modal.js"></script>
<script src="/ui/progress_panel.js"></script>
<script>
// 待決定頁（增量五 Phase 52；design5.md D1／D2／§6.2）。
// 這一頁就是「收件箱（未分類）的縮圖牆」——待決定不是新的儲存位，
// 它是收件箱的另一個說法。照片歸進真資料夾就定案、離開這一頁（不可逆）。
//
// 這一頁只有一個畫面：沒有分頁、沒有 query string，網址就是 /ui/pending.html。
// 資料來源是兩支既有端點，本 phase **沒有新增任何端點**：
//   GET /folders        → 找出 is_inbox 為 true 的那一筆（收件箱）
//   GET /folders/{id}   → 那個資料夾裡的照片摘要（新的在前）
//
// 彈窗鏈（Phase 70 起）：抽屜 → 實體 → **有待辦建議才開**待辦窗，三關。
// 三關的建議都讀 GET /folders/{id} 的八鍵摘要（Phase 61 落庫），不必再看一次圖
// （design5.md D2／§6.2）。鏈本身寫在下面的「待決定的三關彈窗鏈」那一段。
//
// 小工具（el／保護數字單位／getJson／照片卡）與 browse.html 各有一份。
// 這是本專案既有的做法：頁面各自帶自己的小工具（esc() 現在就在
// upload.html／ask.html／camera-desk.html 各有一份）——換來的是
// 「改一頁絕不會弄壞另一頁」。

const view = document.getElementById("view");

// 小工具：造一個元素並填文字。一律用 textContent，不用 innerHTML——
// 照片文字與資料夾名稱是 AI 或使用者填的，裡面若有 < 之類的符號才不會弄壞版面。
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

// 中文排版保護：把「2026 年」這種「數字＋空白＋單位」的空白換成不換行空白
// （\u00a0＝no-break space），免得數字留在行尾、單位被擠到下一行開頭。
// ⚠ 那六個字元一定要照抄成跳脫寫法 \u00a0，不要直接貼一個看起來一樣的空白——
//    肉眼分不出來，但貼成一般空白就完全沒有保護效果了。
function 保護數字單位(text) {
  return String(text).replace(/(\d)\s+(年|月|日|元)/g, "$1\u00a0$2");
}

async function getJson(url) {
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error("HTTP " + response.status + "（" + url + "）");
  }
  return await response.json();
}

// 一張照片卡（與 browse.html 的同名函式逐字相同）。
// 「片語」那一段不是分頁邏輯，是排版保護：正式庫裡有一張照片的說明文字
// 剛好含有「待決定分頁的」這幾個字，中文換行會把它拆得很難看，
// 所以那幾個字包進一個不換行的 <span>（Phase 44 加的）。
function 照片卡(photo) {
  const card = el("button", "photo");
  card.type = "button";
  card.dataset.photoId = photo.id;      // event delegation 用得到

  if (photo.thumbnail_url) {
    const image = document.createElement("img");
    image.src = photo.thumbnail_url;      // 例如 /photos/7/thumbnail
    image.alt = photo.text;
    image.addEventListener("error", function () {
      image.replaceWith(el("div", "placeholder", "無縮圖"));
    });
    card.appendChild(image);
  } else {
    // 舊資料沒有原圖：畫灰底占位，不假裝有圖（design1.md §10）
    card.appendChild(el("div", "placeholder", "無縮圖"));
  }
  const caption = el("div", "caption");
  const 說明 = 保護數字單位(photo.text);
  const 片語 = "待決定分頁的";
  const 片語位置 = 說明.indexOf(片語);
  if (片語位置 === -1) {
    caption.textContent = 說明;
  } else {
    caption.appendChild(document.createTextNode(說明.slice(0, 片語位置)));
    caption.appendChild(el("span", "caption-nowrap", 片語));
    caption.appendChild(document.createTextNode(說明.slice(片語位置 + 片語.length)));
  }
  card.appendChild(caption);

  const item = document.createElement("li");
  item.appendChild(card);
  return item;
}

// ---------- 待決定的三關彈窗鏈（design5.md D2、§6.2）----------
//
// 順序固定：抽屜 → 實體 → 有待辦建議才開待辦窗。三關都結束才 location.reload()。
//
// 三關要用的建議全部來自 GET /folders/{收件箱} 的**八鍵摘要**（Phase 61 落庫、
// 本頁只是讀出來），所以開窗是零延遲的——**不會**再去看一次圖
// （本機看一張圖 64〜88 秒，那是 design5 §6.2 特別交代不要做的事）。
//
// ⚠ 兩個資料形狀要轉換，兩個都是「錯了不會報錯、只會安靜地少一個選項」的地雷：
//   ① suggested_entity 是**名字字串**，openEntityModal 要的是**整筆實體物件**（要 id 才釘得上）
//   ② suggested_task_due 是 ISO 的 "YYYY-MM-DD"；task_modal.js 讀的鍵叫 due（不是 due_date）

let 全部實體 = [];      // GET /entities 的最新清單（每次開實體窗前重抓）

function 開始三關(photo, 可選資料夾) {
  // 第一關【抽屜】：①的來源是 suggested_category（Phase 35 就有了，這裡沿用）。
  // 照名字對回資料夾清單；對不到（或根本沒建議）就沒有①，交給「稍後再說」。
  const 建議資料夾 = photo.suggested_category
    ? 可選資料夾.find(function (f) { return f.name === photo.suggested_category; }) || null
    : null;

  openFolderModal({
    photoId: photo.id,
    folders: 可選資料夾,          // 呼叫端已濾掉收件箱（design2.md D7）
    primary: 建議資料夾,
    primaryVerb: "採用",
    // 抽屜窗結束——定案**或**稍後再說——都接著開實體窗（design3.md §2.1，本增量未推翻）
    onAssigned: function () { 接著釘實體(photo); },
    onClosed: function () { 接著釘實體(photo); }
  });
}

async function 接著釘實體(photo) {
  // 實體清單每次開窗前重抓：上一輪③自創的實體要出現在這一輪的②下拉
  try {
    全部實體 = await getJson("/entities");
  } catch (error) {
    // 拿不到清單就當空清單開窗——③自創與④跳過仍然能走；
    // 真的釘選失敗會以紅字顯示在窗內，不必在這裡另立錯誤畫面。
    全部實體 = [];
  }

  // ★ Phase 70：①終於有東西可顯示了。
  //   suggested_entity 存的是**名字**（photo 表那一欄是 TEXT），
  //   照名字對回剛抓到的實體清單，拿到整筆物件（彈窗要 id 才釘得上）。
  //   對不到就是 null＝①整列不顯示，與改版前完全一樣（實體沒有「未分類」保底）。
  const 建議實體 = photo.suggested_entity
    ? 全部實體.find(function (e) { return e.name === photo.suggested_entity; }) || null
    : null;

  openEntityModal({
    photoId: photo.id,
    entities: 全部實體,
    suggested: 建議實體,
    onDone: function () { 接著確認待辦(photo); }
  });
}

function 接著確認待辦(photo) {
  // 「空關不跳」（design3.md §2.1、design5.md D2／§6.2）：
  // 沒有標題就不開第三窗，直接收工——一個空白的待辦窗只會讓人不知道要填什麼。
  // trim() 不能省：VLM 偶爾回一個只有空白的字串，那不是待辦。
  const 標題 = (photo.suggested_task_title || "").trim();
  if (!標題) {
    收工();
    return;
  }

  openTaskModal({
    photoId: photo.id,
    // ★ 鍵名是 due 不是 due_date（task_modal.js 第 154 行讀的就是 config.suggestion.due）；
    //   值是 "YYYY-MM-DD" 或空字串——<input type="date"> 只吃這個格式。
    suggestion: { title: 標題, due: photo.suggested_task_due || "" },
    onDone: function () { 收工(); }
  });
}

function 收工() {
  // 三關都結束才刷新：定案的照片離開待決定、頂欄的「待決定（N）」跟著少一張。
  // 中途刷新會把還沒開的窗一起關掉，等於使用者被打斷。
  location.reload();
}

// ---------- 唯一的畫面：收件箱縮圖牆 ----------
async function showPending() {
  const folders = await getJson("/folders");
  const inbox = folders.find(function (f) { return f.is_inbox; });
  const detail = await getJson("/folders/" + inbox.id);

  view.textContent = "";

  if (detail.photos.length === 0) {
    // design5.md §6.2：不要再寫「上傳時按稍後再說才看得到」——
    // 增量五做完之後，**所有**新照片都是分析完成後先來這裡。
    view.appendChild(el("p", "message",
      "目前沒有待決定的照片。分析完成的照片會出現在這裡。"));
    return;
  }
  view.appendChild(el("p", "message",
    "點一張照片完成歸類——歸進資料夾後就定案，不能再改。"));

  const wall = el("ul", "wall");
  detail.photos.forEach(function (photo) {
    wall.appendChild(照片卡(photo));
  });

  // 待決定牆：點一張照片就走完整三關（design5.md D2）。
  // 照片對照表把 id 換回**整筆八鍵摘要**——三關要的三個建議都在那一筆裡面，
  // 只傳 photoId 的話等一下還要再查一次。
  const 可選資料夾 = folders.filter(function (f) { return !f.is_inbox; });
  const 照片對照 = {};
  detail.photos.forEach(function (photo) { 照片對照[photo.id] = photo; });

  wall.addEventListener("click", function (event) {
    const card = event.target.closest(".photo");
    if (!card || !card.dataset.photoId) return;
    const photo = 照片對照[Number(card.dataset.photoId)];
    if (!photo) return;        // 理論上不會發生；防的是 DOM 被別的程式改過
    開始三關(photo, 可選資料夾);
  });

  view.appendChild(wall);
}

// ---------- 進入頁面 ----------
(async function start() {
  try {
    await showPending();
  } catch (error) {
    view.textContent = "";
    view.appendChild(el("p", "message",
      "目前無法載入資料。請確認服務已啟動後重新整理頁面。"));
  }
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瀏覽資料夾 — PersonalDocAI</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-brand">PersonalDocAI</h1>
  <nav class="site-nav" aria-label="主要導覽">
    <a href="/ui/upload.html">上傳照片</a>
    <a href="/ui/browse.html" aria-current="page">瀏覽資料夾</a>
    <a href="/ui/ask.html">問問題</a>
  </nav>
</header>

<main class="page">
<div id="view"><p class="message">載入中…</p></div>
</main>

<script src="/ui/folder_modal.js"></script>
<script src="/ui/entity_modal.js"></script>
<script>
const view = document.getElementById("view");

// 狀態都寫在網址上（上一頁／重新整理／書籤才會正常）：
//   browse.html               → 待決定分頁（預設——先處理待辦的檔案櫃心智，design2.md D4）
//   browse.html?tab=folders   → 資料夾分頁
//   browse.html?tab=tasks     → 待辦分頁（design3.md D15 的第三入口）
//   browse.html?folder=N      → 某個資料夾的縮圖牆（純瀏覽）
const 網址參數 = new URLSearchParams(location.search);
const folderIdInUrl = 網址參數.get("folder");
const tabInUrl = 網址參數.get("tab");

// 小工具：造一個元素並填文字。一律用 textContent，不用 innerHTML——
// 照片文字與資料夾名稱是 AI 或使用者填的，裡面若有 < 之類的符號才不會弄壞版面。
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

async function getJson(url) {
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error("HTTP " + response.status + "（" + url + "）");
  }
  return await response.json();
}

// 三個分頁的頁籤列（design2.md D4＋design3.md D15）。「未分類」不再以資料夾卡片出現，
// 它的內容就是「待決定」分頁；「待辦」是使用者按「建立」後的任務清單，不是待決定的照片。
function renderTabs(active, pendingCount, taskCount) {
  const tabs = el("nav", "tabs");
  tabs.setAttribute("aria-label", "瀏覽分頁");
  const pending = el("a", "tab", "待決定（" + pendingCount + "）");
  pending.href = "/ui/browse.html";
  const folders = el("a", "tab", "資料夾");
  folders.href = "/ui/browse.html?tab=folders";
  const tasks = el("a", "tab", "待辦（" + taskCount + "）");
  tasks.href = "/ui/browse.html?tab=tasks";
  const 目前 = { pending: pending, folders: folders, tasks: tasks }[active];
  目前.setAttribute("aria-current", "true");
  tabs.appendChild(pending);
  tabs.appendChild(folders);
  tabs.appendChild(tasks);
  view.appendChild(tabs);
}

// 一張照片卡。可點（待決定分頁）＝ <button>；純瀏覽（資料夾牆）＝ <div>，
// 連游標都不是手指——已定案的照片沒有任何假入口（design2.md D4）。
function 照片卡(photo, 可點) {
  const card = 可點 ? el("button", "photo") : el("div", "photo photo-static");
  if (可點) {
    card.type = "button";
    card.dataset.photoId = photo.id;      // event delegation 用得到
  }

  if (photo.thumbnail_url) {
    const image = document.createElement("img");
    image.src = photo.thumbnail_url;      // 例如 /photos/7/thumbnail
    image.alt = photo.text;
    card.appendChild(image);
  } else {
    // 舊資料沒有原圖：畫灰底占位，不假裝有圖（design1.md §10）
    card.appendChild(el("div", "placeholder", "無縮圖"));
  }
  card.appendChild(el("div", "caption", photo.text));

  const item = document.createElement("li");
  item.appendChild(card);
  return item;
}

// 彈窗 2【實體】：待決定分頁的補完鏈（design3.md §2.1）。
// 這裡沒有持久化的 AI 建議（suggested: null＝①不顯示）——
// 想要建議就按窗裡的「再建議一個」現算；實體清單開窗前現抓最新的。
async function 接著釘實體(photoId) {
  let entities = [];
  try {
    entities = await getJson("/entities");
  } catch (error) {
    // 拿不到清單就當空清單開窗——③自創與④跳過仍然能走；
    // 之後真的釘選失敗會以紅字顯示在窗內，不必在這裡另立錯誤畫面。
  }
  openEntityModal({
    photoId: photoId,
    entities: entities,
    suggested: null,
    onDone: function () {
      location.reload();   // 鏈收工才刷新：定案的照片離開待決定、計數更新
    }
  });
}

// ---------- 分頁一：待決定（預設）----------
async function showPending() {
  const folders = await getJson("/folders");
  const inbox = folders.find(function (f) { return f.is_inbox; });
  const detail = await getJson("/folders/" + inbox.id);
  const tasks = await getJson("/tasks");    // 只為頁籤計數；本地服務多一個小 GET 無妨

  view.textContent = "";
  renderTabs("pending", detail.folder.photo_count, tasks.length);

  if (detail.photos.length === 0) {
    view.appendChild(el("p", "message",
      "目前沒有待決定的照片。上傳時按「稍後再說」的照片會出現在這裡。"));
    return;
  }
  view.appendChild(el("p", "message",
    "點一張照片完成歸類——歸進資料夾後就定案，不能再改。"));

  const wall = el("ul", "wall");
  detail.photos.forEach(function (photo) {
    wall.appendChild(照片卡(photo, true));
  });

  // 待決定分頁的彈窗：沒有①（這裡沒有持久化的 AI 建議，design2.md D5）；
  // 下拉排除收件箱（design2.md D7）；「稍後再說」＝什麼都不做、照片留在這裡。
  const 可選資料夾 = folders.filter(function (f) { return !f.is_inbox; });
  wall.addEventListener("click", function (event) {
    const card = event.target.closest(".photo");
    if (!card || !card.dataset.photoId) return;
    const photoId = Number(card.dataset.photoId);

    openFolderModal({
      photoId: photoId,
      folders: 可選資料夾,
      primary: null,
      // 彈窗鏈（design3.md §2.1）：抽屜窗結束——定案**或**稍後再說——都接著開實體窗；
      // 整頁重讀移到鏈的最尾端（歸檔可能已發生，等實體窗收工一次刷新最單純）。
      onAssigned: function () { 接著釘實體(photoId); },
      onClosed: function () { 接著釘實體(photoId); }
    });
  });

  view.appendChild(wall);
}

// ---------- 分頁二：資料夾卡片 ----------
async function showFolderList() {
  const folders = await getJson("/folders");
  const inbox = folders.find(function (f) { return f.is_inbox; });
  const tasks = await getJson("/tasks");

  view.textContent = "";
  renderTabs("folders", inbox.photo_count, tasks.length);

  const list = el("ul", "folders");
  folders.filter(function (f) { return !f.is_inbox; }).forEach(function (folder) {
    const link = el("a", "folder");
    link.href = "/ui/browse.html?folder=" + folder.id;
    link.appendChild(el("div", "folder-name",
      folder.name + "（" + folder.photo_count + " 張）"));
    link.appendChild(el("div", "folder-desc", folder.description));

    const item = document.createElement("li");
    item.appendChild(link);
    list.appendChild(item);
  });
  view.appendChild(list);
}

// ---------- 分頁三：待辦（design3.md D13、D15；§7＝能列、能點回來源圖就好）----------
async function showTasks() {
  const folders = await getJson("/folders");
  const inbox = folders.find(function (f) { return f.is_inbox; });
  const tasks = await getJson("/tasks");    // 先到期的在前、沒到期日的最後（排序在後端）

  view.textContent = "";
  renderTabs("tasks", inbox.photo_count, tasks.length);

  if (tasks.length === 0) {
    view.appendChild(el("p", "message",
      "還沒有待辦。上傳時 AI 判斷有可辦事項、且你按「建立」的會出現在這裡。"));
    return;
  }
  view.appendChild(el("p", "message", "點一列可開來源照片的原圖。"));

  const list = el("ul", "tasks");
  tasks.forEach(function (task) {
    const row = el("a", "task-row");
    // 「能點回來源圖」（design3.md §7）：直接連原圖端點、開新分頁。
    // 舊照片沒有原圖時端點回 404——與縮圖占位同一套「不假裝有圖」的態度。
    row.href = "/photos/" + task.photo_id + "/image";
    row.target = "_blank";
    row.rel = "noopener";

    if (task.thumbnail_url) {
      const image = document.createElement("img");
      image.className = "task-thumb";
      image.src = task.thumbnail_url;
      image.alt = task.title;
      row.appendChild(image);
    } else {
      row.appendChild(el("div", "task-thumb-empty", "無縮圖"));
    }
    row.appendChild(el("span", "task-title", task.title));
    row.appendChild(el("span", "task-due",
      task.due_date ? "到期 " + task.due_date : "無到期日"));

    const item = document.createElement("li");
    item.appendChild(row);
    list.appendChild(item);
  });
  view.appendChild(list);
}

// ---------- 畫面三：某個資料夾的縮圖牆（純瀏覽，design2.md D4）----------
async function showFolderPhotos(folderId) {
  const detail = await getJson("/folders/" + folderId);

  view.textContent = "";

  const back = el("a", "back-link", "← 回資料夾列表");
  back.href = "/ui/browse.html?tab=folders";
  view.appendChild(back);

  view.appendChild(el("h2", null,
    detail.folder.name + "（" + detail.folder.photo_count + " 張）"));
  view.appendChild(el("p", "folder-desc", detail.folder.description));

  if (detail.photos.length === 0) {
    view.appendChild(el("p", "message", "這個資料夾還沒有照片。"));
    return;
  }

  const wall = el("ul", "wall");
  detail.photos.forEach(function (photo) {
    wall.appendChild(照片卡(photo, false));   // 已定案：純瀏覽、不可點
  });
  view.appendChild(wall);
}

// ---------- 進入頁面時決定畫哪一個 ----------
(async function start() {
  try {
    if (folderIdInUrl) {
      await showFolderPhotos(folderIdInUrl);
    } else if (tabInUrl === "folders") {
      await showFolderList();
    } else if (tabInUrl === "tasks") {
      await showTasks();
    } else {
      await showPending();
    }
  } catch (error) {
    view.textContent = "";
    view.appendChild(el("p", "message",
      "載入失敗：" + error + "。uvicorn 是不是沒在跑？"));
  }
})();
</script>

</body>
</html>

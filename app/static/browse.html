<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瀏覽資料夾 — PersonalDocAI</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-brand">PersonalDocAI</h1>
  <nav class="site-nav" aria-label="主要導覽">
    <a href="/ui/upload.html">上傳照片</a>
    <a href="/ui/pending.html">待決定（<span id="nav-pending-count">…</span>）</a>
    <a href="/ui/browse.html" aria-current="page">瀏覽資料夾</a>
    <a href="/ui/ask.html">問問題</a>
  </nav>
</header>

<main class="page">
<div id="view"><p class="message">載入中…</p></div>
</main>

<script src="/ui/photo_detail_modal.js"></script>
<script src="/ui/progress_panel.js"></script>
<script>
const view = document.getElementById("view");

// 狀態都寫在網址上（上一頁／重新整理／書籤才會正常）：
//   browse.html               → 資料夾分頁（**預設**；design5.md §6.3 起改成這個）
//   browse.html?tab=folders   → 資料夾分頁（明寫也可以，舊書籤仍然有效）
//   browse.html?tab=tasks     → 待辦分頁（design3.md D15 的第三入口）
//   browse.html?folder=N      → 某個資料夾的縮圖牆（點照片開唯讀詳情窗）
//
// 「待決定」不在這一頁了——它在頂欄的「待決定（N）」那一格（design5.md D1、§6.3）。
//（這段註解刻意不寫出待決定頁的網址：契約測試斷言那個網址在本檔**只出現一次**，
//  就是頂欄那一格的連結。）
// ⚠ 刻意**不做**「舊書籤 browse.html 自動轉址到 pending」（design5.md §6.3 明文）：
//    頂欄已經有那一格，多一個轉址只會讓「browse.html」這個網址自己跑掉。
const 網址參數 = new URLSearchParams(location.search);
const folderIdInUrl = 網址參數.get("folder");
const tabInUrl = 網址參數.get("tab");

// 小工具：造一個元素並填文字。一律用 textContent，不用 innerHTML——
// 照片文字與資料夾名稱是 AI 或使用者填的，裡面若有 < 之類的符號才不會弄壞版面。
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function 保護數字單位(text) {
  return String(text).replace(/(\d)\s+(年|月|日|元)/g, "$1\u00a0$2");
}

async function getJson(url) {
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error("HTTP " + response.status + "（" + url + "）");
  }
  return await response.json();
}

// 兩個分頁的頁籤列。待決定升到頂欄之後這裡只剩兩格（design5.md §6.3）。
// 「未分類（收件箱）」仍然不以資料夾卡片出現——它的內容就是頂欄那一格的待決定頁；
// 「待辦」是使用者按過「建立」的任務清單，不是待決定的照片。
function renderTabs(active, taskCount) {
  const tabs = el("nav", "tabs");
  tabs.setAttribute("aria-label", "瀏覽分頁");
  const folders = el("a", "tab", "資料夾");
  folders.href = "/ui/browse.html?tab=folders";
  const tasks = el("a", "tab", "待辦（" + taskCount + "）");
  tasks.href = "/ui/browse.html?tab=tasks";
  const 目前 = { folders: folders, tasks: tasks }[active];
  目前.setAttribute("aria-current", "true");
  tabs.appendChild(folders);
  tabs.appendChild(tasks);
  view.appendChild(tabs);
}

// 一張照片卡（資料夾縮圖牆用；點下去開唯讀詳情窗——監聽掛在 showFolderPhotos 的牆上）。
function 照片卡(photo) {
  const card = el("button", "photo");
  card.type = "button";
  card.dataset.photoId = photo.id;      // event delegation 用得到

  if (photo.thumbnail_url) {
    const image = document.createElement("img");
    image.src = photo.thumbnail_url;      // 例如 /photos/7/thumbnail
    image.alt = photo.text;
    image.addEventListener("error", function () {
      image.replaceWith(el("div", "placeholder", "無縮圖"));
    });
    card.appendChild(image);
  } else {
    // 舊資料沒有原圖：畫灰底占位，不假裝有圖（design1.md §10）
    card.appendChild(el("div", "placeholder", "無縮圖"));
  }
  const caption = el("div", "caption");
  const 說明 = 保護數字單位(photo.text);
  const 片語 = "待決定分頁的";
  const 片語位置 = 說明.indexOf(片語);
  if (片語位置 === -1) {
    caption.textContent = 說明;
  } else {
    caption.appendChild(document.createTextNode(說明.slice(0, 片語位置)));
    caption.appendChild(el("span", "caption-nowrap", 片語));
    caption.appendChild(document.createTextNode(說明.slice(片語位置 + 片語.length)));
  }
  card.appendChild(caption);

  const item = document.createElement("li");
  item.appendChild(card);
  return item;
}

// ---------- 分頁一：資料夾卡片（無 query 時的預設）----------
async function showFolderList() {
  const folders = await getJson("/folders");
  const tasks = await getJson("/tasks");    // 只為頁籤計數；本地服務多一個小 GET 無妨

  view.textContent = "";
  renderTabs("folders", tasks.length);

  const list = el("ul", "folders");
  folders.filter(function (f) { return !f.is_inbox; }).forEach(function (folder) {
    const link = el("a", "folder");
    link.href = "/ui/browse.html?folder=" + folder.id;
    link.appendChild(el("div", "folder-name",
      folder.name + "（" + folder.photo_count + " 張）"));
    link.appendChild(el("div", "folder-desc", folder.description));

    const item = document.createElement("li");
    item.appendChild(link);
    list.appendChild(item);
  });
  view.appendChild(list);
}

// ---------- 分頁二：待辦（design3.md D13、D15；點一列開唯讀詳情窗＝design4.md D1）----------
async function showTasks() {
  const tasks = await getJson("/tasks");    // 先到期的在前、沒到期日的最後（排序在後端）

  view.textContent = "";
  renderTabs("tasks", tasks.length);

  if (tasks.length === 0) {
    view.appendChild(el("p", "message",
      "還沒有待辦。上傳時 AI 判斷有可辦事項、且你按「建立」的會出現在這裡。"));
    return;
  }
  view.appendChild(el("p", "message",
    "點一列可以看這件待辦的來源照片與完整說明。"));

  const list = el("ul", "tasks");
  tasks.forEach(function (task) {
    // 改開頁內詳情窗（design4.md D1／§1.1）：不再開新分頁——新分頁只有一張裸圖，
    // 看不到 AI 寫的說明，也回不去這一頁。
    // （刻意不寫出舊的 target 屬性值：驗收會 grep 掃它，註解不能誤中。）
    const row = el("button", "task-row");
    row.type = "button";

    if (task.thumbnail_url) {
      const image = document.createElement("img");
      image.className = "task-thumb";
      image.src = task.thumbnail_url;
      image.alt = task.title;
      image.addEventListener("error", function () {
        image.replaceWith(el("div", "task-thumb-empty", "無縮圖"));
      });
      row.appendChild(image);
    } else {
      row.appendChild(el("div", "task-thumb-empty", "無縮圖"));
    }
    row.appendChild(el("span", "task-title", task.title));
    row.appendChild(el("span", "task-due",
      task.due_date ? "到期 " + task.due_date : "無到期日"));

    // 每一列各掛一個監聽（不用縮圖牆那種事件委派）：待辦列表短，
    // 而且每列要帶三個欄位——塞進 dataset 全都會變字串、null 會變 "null"。
    // 用閉包直接抓住 task 這個物件最單純。
    row.addEventListener("click", function () {
      openPhotoDetailModal({
        photoId: task.photo_id,
        task: { title: task.title, due_date: task.due_date }
      });
    });

    const item = document.createElement("li");
    item.appendChild(row);
    list.appendChild(item);
  });
  view.appendChild(list);
}

// ---------- 畫面三：某個資料夾的縮圖牆（點照片開唯讀詳情窗，design4.md §1.1 第 1 列）----------
async function showFolderPhotos(folderId) {
  const detail = await getJson("/folders/" + folderId);

  view.textContent = "";

  const back = el("a", "back-link", "← 回資料夾列表");
  back.href = "/ui/browse.html?tab=folders";
  view.appendChild(back);

  view.appendChild(el("h2", null,
    detail.folder.name + "（" + detail.folder.photo_count + " 張）"));
  view.appendChild(el("p", "folder-desc", detail.folder.description));

  if (detail.photos.length === 0) {
    view.appendChild(el("p", "message", "這個資料夾還沒有照片。"));
    return;
  }

  view.appendChild(el("p", "message",
    "點一張照片可以看大圖與完整說明。已定案的照片不能改資料夾。"));

  const wall = el("ul", "wall");
  detail.photos.forEach(function (photo) {
    wall.appendChild(照片卡(photo));
  });

  // 資料夾牆：點照片開**唯讀**詳情窗（design4.md D1／D2）。
  // 這裡刻意不帶 task——待辦那一行只有待辦分頁才畫（Phase 40）。
  wall.addEventListener("click", function (event) {
    const card = event.target.closest(".photo");
    if (!card || !card.dataset.photoId) return;
    openPhotoDetailModal({ photoId: Number(card.dataset.photoId), task: null });
  });

  view.appendChild(wall);
}

// ---------- 進入頁面時決定畫哪一個 ----------
(async function start() {
  try {
    if (folderIdInUrl) {
      await showFolderPhotos(folderIdInUrl);
    } else if (tabInUrl === "tasks") {
      await showTasks();
    } else {
      await showFolderList();   // 無 query 與 ?tab=folders 都走這裡（design5.md §6.3）
    }
  } catch (error) {
    view.textContent = "";
    view.appendChild(el("p", "message",
      "目前無法載入資料。請確認服務已啟動後重新整理頁面。"));
  }
})();
</script>

</body>
</html>
